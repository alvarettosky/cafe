name: Nightly Tests

on:
  schedule:
    # Run every night at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  mutation-tests:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker mutation tests
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30

  load-tests:
    name: Load Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Antes se instalaba por apt desde dl.k6.io, sin fijar version: el gate podia
      # cambiar de comportamiento de una noche a otra sin que nadie tocara el repo,
      # y dependia de un keyserver externo como punto de fallo.
      - name: Install k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          k6-version: '2.2.0'

      - name: Create output directory
        run: mkdir -p test-results/load

      # --quiet suprime la barra de progreso: generaba ~480 lineas de "running (Xm)"
      # por corrida y enterraba el resumen y el motivo real del fallo.
      - name: Run load tests
        run: k6 run --quiet tests/load/api-stress-test.js
        env:
          BASE_URL: https://cafe-pi-steel.vercel.app

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-test-results
          path: test-results/load/
          retention-days: 30
