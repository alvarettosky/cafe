name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: unit-tests
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # Las cuatro puertas de arriba pasaron en verde el 2026-07-27 mientras
  # `app/page.tsx` llamaba a una RPC que no existia en la base (HTTP 404,
  # PGRST202) y los KPIs del dashboard mostraban `...` en produccion.
  #
  # Ninguna podia verlo: una RPC es un string, y ninguna habla con la base.
  # Un chequeo contra supabase/migrations/ tampoco habria servido —
  # 004_dashboard_stats.sql SI definia la funcion, pero nunca se aplico.
  contract-check:
    name: Contract & Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Sin red ni secretos. Recorre TODO lo versionado, no solo el diff:
      # lo que ya esta publicado es lo que importa.
      - name: Credenciales en archivos versionados
        run: git ls-files | xargs node scripts/check-secrets.mjs

      # Con secretos, compara las RPC invocadas contra las que la base expone.
      # Sin ellos el script avisa y sale con 0; el aviso no es un aprobado.
      - name: Contrato de RPC contra la base real
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:rpc

      # El verificador se prueba a si mismo ANTES de que su veredicto cuente.
      # Sin red: ejerce el clasificador con los siete casos reales observados.
      - name: Autoprueba del detector de exposicion anonima
        run: npm run check:anon:autotest

      # Pregunta a la base, con la MISMA clave publica que va en el bundle, si
      # alguna tabla o vista devuelve datos a un anonimo. Nacio el 2026-08-07:
      # cuatro vistas sin `security_invoker` filtraban nombre, telefono, email y
      # valor de vida de los clientes, y ni RLS ni politicas ni el contrato de
      # RPC podian verlo, porque una vista no es una tabla ni una funcion.
      # `--strict` es lo que impide el verde vacio: sin secretos el script
      # sale con 1 en vez de con 0. GitHub Actions NO inyecta secretos en los
      # PR desde forks y este repositorio es publico, asi que sin esto un PR
      # de fork ensenaba una marca verde junto a un paso que afirma que nada
      # esta expuesto, sin haber tocado la base.
      - name: Ninguna tabla ni vista expone datos a un anonimo
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run check:anon -- --strict

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, type-check]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next/
          retention-days: 7
